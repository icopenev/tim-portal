<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>График</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #1f2933;
    font-family: Arial, Helvetica, sans-serif;
}

.topbar {
    background: #252b31;
    color: #fff;
    padding: 12px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.topbar-left,
.topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.topbar h1 {
    margin: 0;
    font-size: 19px;
}

button {
    cursor: pointer;
}

.topbar button {
    border: 1px solid #697078;
    background: #343b42;
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
}

.topbar button:hover {
    background: #484f56;
}

.container {
    padding: 20px;
}

.header-box {
    background: #fff;
    border: 1px solid #cfd3d7;
    margin-bottom: 14px;
    padding: 16px;
}

.title {
    text-align: center;
}

.title h2 {
    margin: 0;
    font-size: 25px;
    letter-spacing: 2px;
}

.department {
    margin-top: 5px;
    font-size: 16px;
    font-weight: bold;
}

.month-title {
    margin-top: 5px;
    font-size: 15px;
}

.controls {
    margin-top: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
}

.controls select,
.controls button {

    border: 1px solid #aeb4ba;
    border-radius: 4px;
    padding: 0 10px;
    background: #fff;
}

.controls button {
    font-weight: bold;
}

.controls .pdf-btn {

    color: #fff;

}

.controls .employee-btn {
    background: #2f6f4e;
    color: white;
    border-color: #2f6f4e;
}

.controls .shift-btn {
    background: #495b6b;
    color: white;
    border-color: #495b6b;
}

.admin-badge {
    background: #eceff1;
    padding: 7px 10px;
    border-radius: 4px;
    font-size: 12px;
}

#error {
    display: none;
    background: #fbeaea;
    color: #9b2020;
    border: 1px solid #dda8a8;
    padding: 10px;
    margin-bottom: 12px;
}

.table-wrapper {
    background: #fff;
    border: 1px solid #b8bdc2;
    overflow-x: auto;

}

table {

    background: #fff;
}

th,
td {

}

thead th {

}

.num-head {

}

.employee-head {

}

.day-head {

}

.weekday {

}

.day-number {

}

.employee-number {

.employee-name {

}

.employee-row-content {

}

.employee-info {

}

.employee-main-name {

}

.employee-position {

.employee-actions {

}

.employee-actions button {

.weekend {

}

.shift-duty {

}

.shift-off {

.shift-vacation {

.shift-sick {

.stats-head {

.legend-row {

}

.cell-menu {

/* MODAL */

.modal-overlay {

    position: fixed;

    align-items: center;
    justify-content: center;
}

.modal {

.modal-header {

.modal-body {

.modal-footer {

.modal-footer button {

}

.form-group {

.form-row {

.form-group label {

    margin-bottom: 5px;

.form-group input,

.checkbox-row {

    gap: 8px;

.checkbox-row input {

    height: auto;
}

    background: #fbeaea;
    color: #9b2020;
    padding: 8px;

/* SHIFT MANAGER */

}

.shift-manager-header button {

    }

    }

    .shift-cell {
        height: 18px;
        font-size: 6pt;
    }

        font-size: 5pt;
        padding-top: 1px;
    }

    .day-number {
        font-size: 6pt;
        padding: 1px;
    }

        font-size: 5pt;

    .shift-duty,
    .shift-off,
    .shift-vacation,

    }

<script>

let currentUser = null;
let currentObject = null;

let employees = [];
let shifts = [];
let scheduleEntries = [];

let selectedEmployeeId = null;
let selectedDate = null;

let editingEmployeeId = null;
let editingShiftId = null;


const params =
    new URLSearchParams(
        window.location.search
    );

const objectId =
    Number(
        params.get('object')
    );



let workCalendar = null;
let workCalendarDays = [];


/* =====================================================
   CENTRAL WORK CALENDAR
===================================================== */

async function loadWorkCalendar(
    year,
    month
) {

    workCalendar = null;
    workCalendarDays = [];


    try {

        const calendarResponse =
            await fetch(
                '/staff-compat-api.php/api/calendar/' +
                year +
                '/' +
                month,
                {
                    credentials:
                        'same-origin'
                }
            );


        if (!calendarResponse.ok) {

            throw new Error(
                'Няма данни за работния календар.'
            );
        }


        const calendarData =
            await calendarResponse.json();


        workCalendar =
            calendarData;


        const daysResponse =
            await fetch(
                '/staff-compat-api.php/api/calendar/' +
                year +
                '/' +
                month +
                '/days',
                {
                    credentials:
                        'same-origin'
                }
            );


        if (!daysResponse.ok) {

            throw new Error(
                'Не могат да се заредят дните от календара.'
            );
        }


        const daysData =
            await daysResponse.json();


        workCalendarDays =
            Array.isArray(daysData)
                ? daysData
                : [];


        /*
           Ако sync-ът към КиК е неуспешен,
           продължаваме с последния локален календар.
        */

        if (
            calendarData.fallback
        ) {

            showError(
                'Календарът не е обновен от КиК. ' +
                'Използват се последните локално записани данни.'
            );
        }


    } catch (error) {

        console.error(
            'Calendar:',
            error
        );


        showError(
            'Работният календар не може да бъде зареден. ' +
            'Използва се резервно събота/неделя.'
        );
    }
}



function getCalendarDay(
    year,
    month,
    day
) {

    const dateString =
        formatDate(
            year,
            month,
            day
        );


    return workCalendarDays.find(
        item =>
            item.work_date ===
            dateString
    ) || null;
}



function isCalendarNonWorkday(
    year,
    month,
    day
) {

    const calendarDay =
        getCalendarDay(
            year,
            month,
            day
        );


    /*
       Основен режим:
       централният календар.
    */

    if (calendarDay) {

        return (
            Number(
                calendarDay.is_workday
            ) !== 1
        );
    }


    /*
       Fallback:
       ако няма календарни данни.
    */

    const date =
        new Date(
            year,
            month - 1,
            day
        );


    return (
        date.getDay() === 0 ||
        date.getDay() === 6
    );
}




function calendarDayClass(
    year,
    month,
    day
) {

    const calendarDay =
        getCalendarDay(
            year,
            month,
            day
        );


    if (calendarDay) {

        if (
            Number(
                calendarDay.is_holiday
            ) === 1
        ) {

            return 'calendar-holiday';
        }


        if (
            Number(
                calendarDay.is_workday
            ) !== 1
        ) {

            return 'calendar-off';
        }
    }


    return '';
}


function calendarDayTitle(
    year,
    month,
    day
) {

    const calendarDay =
        getCalendarDay(
            year,
            month,
            day
        );


    if (
        calendarDay &&
        calendarDay.holiday_name
    ) {

        return calendarDay.holiday_name;
    }


    return '';
}

                escapeHtml(
                    shift.code
                ) +

                ) +
                '</span>';


            html +=
                '</div>';
        }
    );


    container.innerHTML =
        html;

function buildShiftDescription(
    shift
) {

    let text =
        shift.name || '';


    if (
        shift.time_from &&
        shift.time_to
    ) {

        text +=
            ' от ' +
            shortTime(
                shift.time_from
            ) +
            'ч. до ' +
            shortTime(
                shift.time_to
            ) +
            'ч.';
    }


    return text;
}



function shortTime(value) {

    if (!value) {
        return '';
    }


    return String(value)
        .substring(
            0,
            5
        );
}

/* =====================================================

===================================================== */

function createMonthYearSelectors() {

    const monthSelect =
        document.getElementById(
            'monthSelect'
        );


    monthNames.forEach(
        (name, index) => {

            const option =
                document.createElement(
                    'option'
                );


            option.value =
                index + 1;


            option.textContent =
                name;


            monthSelect
                .appendChild(
                    option
                );
        }
    );


    const yearSelect =
        document.getElementById(
            'yearSelect'
        );


    const now =
        new Date();


    for (
        let year =
            now.getFullYear() - 5;

        year <=
            now.getFullYear() + 5;

        year++
    ) {

        const option =
            document.createElement(
                'option'
            );


        option.value =
            year;


        option.textContent =
            year;


        yearSelect
            .appendChild(
                option
            );
    }


    monthSelect.value =
        now.getMonth() + 1;


    yearSelect.value =
        now.getFullYear();
}



function previousMonth() {

    let month =
        Number(
            document
                .getElementById(
                    'monthSelect'
                )
                .value
        );


    let year =
        Number(
            document
                .getElementById(
                    'yearSelect'
                )
                .value
        );


    month--;


    if (
        month < 1
    ) {

        month = 12;

        year--;
    }


    ensureYearOption(
        year
    );


    document
        .getElementById(
            'monthSelect'
        )
        .value =
            month;


    document
        .getElementById(
            'yearSelect'
        )
        .value =
            year;


    loadSchedule();
}

        );


    month++;


    if (
        month > 12
    ) {

        month = 1;

        year++;
    }


    ensureYearOption(
        year
    );


    document
        .getElementById(
            'monthSelect'
        )
        .value =
            month;


    document
        .getElementById(
            'yearSelect'
        )
        .value =
            year;


    loadSchedule();
}



function ensureYearOption(
    year
) {

    const select =
        document.getElementById(
            'yearSelect'
        );


    const exists =
        Array.from(
            select.options
        )
        .some(
            option =>
                Number(
                    option.value
                ) ===
                Number(year)
        );


    if (!exists) {

        const option =
            document.createElement(
                'option'
            );


        option.value =
            year;


        option.textContent =
            year;


        select.appendChild(
            option
        );
    }
}

async function saveCell(
    shiftId,
    force = false
) {

    closeCellMenu();


    try {

        const response =
            await fetch(
                '/staff-compat-api.php/api/schedules/entry',
                {
                    method:
                        'PUT',

                    credentials:
                        'same-origin',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body:
                        JSON.stringify({
                            object_id:
                                objectId,

                            employee_id:
                                selectedEmployeeId,

                            work_date:
                                selectedDate,

                            shift_id:
                                shiftId,

                            note:
                                '',

                            force:
                                force
                        })
                }
            );


        const data =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if (
            response.status === 409 &&
            data.requires_confirmation
        ) {

            const confirmed =
                confirm(
                    data.error +
                    '\n\nДа се запише ли смяната въпреки това?'
                );


            if (confirmed) {

                await saveCell(
                    shiftId,
                    true
                );
            }

            return;
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                'Грешка при запис'
            );
        }


        await loadSchedule();


    } catch (error) {

        showError(
            error.message
        );
    }
}



/* =====================================================
   STATS
===================================================== */

function calculateStats(
    employeeId,
    year,
    month
) {

    let workDays = 0;
    let hours = 0;
    let nightHours = 0;
    let holidayHours = 0;
    let duties = 0;
    let vacation = 0;
    let sick = 0;


    scheduleEntries.forEach(
        entry => {

            if (
                Number(
                    entry.employee_id
                ) !==
                Number(
                    employeeId
                )
            ) {
                return;
            }


            const entryDate =
                normalizeDate(
                    entry.work_date
                );


            if (
                Number(
                    entryDate.substring(
                        0,
                        4
                    )
                ) !== year ||
                Number(
                    entryDate.substring(
                        5,
                        7
                    )
                ) !== month
            ) {
                return;
            }


            const shift =
                findShift(
                    entry.shift_id
                );


            if (!shift) {
                return;
            }


            if (
                Number(
                    shift.counts_as_work_day
                ) === 1
            ) {

                workDays++;
            }


            if (
                shift.type ===
                'work'
            ) {

                hours +=
                    calculateShiftHours(
                        shift.time_from,
                        shift.time_to
                    );

                nightHours +=
                    calculateNightHours(
                        shift.time_from,
                        shift.time_to
                    );

                holidayHours +=
                    calculateHolidayHours(
                        entryDate,
                        shift.time_from,
                        shift.time_to
                    );
            }


            if (
                shift.type ===
                'duty'
            ) {

                duties++;

                nightHours +=
                    calculateNightHours(
                        shift.time_from,
                        shift.time_to
                    );

                holidayHours +=
                    calculateHolidayHours(
                        entryDate,
                        shift.time_from,
                        shift.time_to
                    );
            }


            if (
                shift.type ===
                'vacation'
            ) {

                vacation++;


                /*
                   Отпускът участва в месечната
                   норма на работното време.

                   Начисляваме 8 часа само ако
                   датата е работен ден според
                   централния календар.
                */

                const calendarDay =
                    workCalendarDays.find(
                        item =>
                            item.work_date ===
                            entryDate
                    );


                if (
                    calendarDay &&
                    Number(
                        calendarDay.is_workday
                    ) === 1
                ) {

                    hours += 8;
                }
            }


            if (
                shift.type ===
                'sick'
            ) {

                sick++;
            }
        }
    );


    return {
        workDays,
        hours,
        nightHours,
        holidayHours,
        duties,
        vacation,
        sick
    };
}




function calculateHolidayHours(
    workDate,
    timeFrom,
    timeTo
) {

    if (
        !workDate ||
        !timeFrom ||
        !timeTo
    ) {
        return 0;
    }


    const start =
        timeToMinutes(
            timeFrom
        );


    let end =
        timeToMinutes(
            timeTo
        );


    const overnight =
        end <= start;


    let total = 0;


    // =========================================
    // Първи календарен ден
    // =========================================

    const firstEnd =
        overnight
            ? 24 * 60
            : end;


    const firstMinutes =
        Math.max(
            0,
            firstEnd - start
        );


    const firstCalendarDay =
        workCalendarDays.find(
            item =>
                item.work_date ===
                workDate
        );


    if (
        firstCalendarDay &&
        Number(
            firstCalendarDay.is_holiday
        ) === 1
    ) {

        total +=
            firstMinutes / 60;
    }


    // =========================================
    // Следващ календарен ден
    // =========================================

    if (overnight) {

        const parts =
            workDate.split('-');


        const nextDate =
            new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2]) + 1
            );


        const nextDateString =
            nextDate.getFullYear() +
            '-' +
            String(
                nextDate.getMonth() + 1
            ).padStart(2, '0') +
            '-' +
            String(
                nextDate.getDate()
            ).padStart(2, '0');


        const nextCalendarDay =
            workCalendarDays.find(
                item =>
                    item.work_date ===
                    nextDateString
            );


        if (
            nextCalendarDay &&
            Number(
                nextCalendarDay.is_holiday
            ) === 1
        ) {

            total +=
                end / 60;
        }
    }


    return total;
}


function calculateShiftHours(
    timeFrom,
    timeTo
) {

    if (
        !timeFrom ||
        !timeTo
    ) {
        return 0;
    }


    const from =
        timeToMinutes(
            timeFrom
        );


    let to =
        timeToMinutes(
            timeTo
        );


    if (
        to < from
    ) {

        to +=
            24 * 60;
    }


    return (
        to - from
    ) / 60;
}




function calculateNightHours(
    timeFrom,
    timeTo
) {

    if (
        !timeFrom ||
        !timeTo
    ) {
        return 0;
    }


    const start =
        timeToMinutes(
            timeFrom
        );


    let end =
        timeToMinutes(
            timeTo
        );


    if (
        end <= start
    ) {
        end +=
            24 * 60;
    }


    let total = 0;


    /*
       Нощен труд:
       22:00 - 06:00

       Проверяваме два нощни прозореца,
       за да покрием смяна през полунощ.
    */

    const windows = [
        [22 * 60, 30 * 60],
        [-2 * 60, 6 * 60]
    ];


    for (
        const [nightStart, nightEnd]
        of windows
    ) {

        const overlapStart =
            Math.max(
                start,
                nightStart
            );


        const overlapEnd =
            Math.min(
                end,
                nightEnd
            );


        if (
            overlapEnd >
            overlapStart
        ) {

            total +=
                overlapEnd -
                overlapStart;
        }
    }


    return total / 60;
}


function timeToMinutes(
    value
) {

    const parts =
        String(value)
            .split(':');


    return (
        Number(parts[0]) *
            60 +
        Number(parts[1])
    );
}



function formatHours(
    hours
) {

    return Number.isInteger(
        hours
    )
        ? hours
        : hours.toFixed(1);
}



/* =====================================================
   HELPERS
===================================================== */

function findEntry(
    employeeId,
    dateString
) {

    return scheduleEntries.find(
        entry =>
            Number(
                entry.employee_id
            ) ===
                Number(
                    employeeId
                ) &&

            normalizeDate(
                entry.work_date
            ) ===
                dateString
    );
}



function findShift(
    shiftId
) {

    return shifts.find(
        shift =>
            Number(
                shift.id
            ) ===
            Number(
                shiftId
            )
    );
}



function shiftClass(
    type
) {

    switch (type) {

        case 'work':
            return 'shift-work';

        case 'duty':
            return 'shift-duty';

        case 'off':
            return 'shift-off';

        case 'vacation':
            return 'shift-vacation';

        case 'sick':
            return 'shift-sick';

        default:
            return '';
    }
}



function formatDate(
    year,
    month,
    day
) {

    return (
        year +
        '-' +
        String(month)
            .padStart(
                2,
                '0'
            ) +
        '-' +
        String(day)
            .padStart(
                2,
                '0'
            )
    );
}



function normalizeDate(
    value
) {

    if (!value) {
        return '';
    }


    return String(value)
        .substring(
            0,
            10
        );
}

   API

async function apiFetch(
    url
) {

    try {

        const response =
            await fetch(
                url,
                {
                    credentials:
                        'same-origin'
                }
            );


        if (
            response.status ===
            401
        ) {

            window.location.href =
                '/login.php';

            return null;
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'API грешка'
            );
        }


        return data;


    } catch (error) {

        showError(
            error.message
        );

        return null;
    }
}

function exportPlan160() {

    const extraEmployeeName =
        prompt(
            'Име на допълнителния служител:',
            'Допълнителен служител'
        );


    if (
        extraEmployeeName === null
    ) {
        return;
    }


    const name =
        extraEmployeeName.trim() ||
        'Допълнителен служител';


    const originalTable =
        document.querySelector(
            '#tableWrapper table'
        );


    if (!originalTable) {

        showError(
            'Няма зареден график.'
        );

        return;
    }


    /*
        Копираме текущата таблица.

        Промените по-долу са САМО
        върху копието за печат.
    */
    const table =
        originalTable.cloneNode(
            true
        );


    /*
        Махаме бутоните за редакция
        от print копието.
    */
    table
        .querySelectorAll(
            '.employee-actions'
        )
        .forEach(
            element =>
                element.remove()
        );


    table
        .querySelectorAll(
            '.shift-cell'
        )
        .forEach(
            cell => {

                cell.removeAttribute(
                    'onclick'
                );
            }
        );


    const tbody =
        table.querySelector(
            'tbody'
        );


    if (!tbody) {

        showError(
            'Не може да се създаде планов график.'
        );

        return;
    }


    /*
        Намираме смяната П,
        за да я използваме визуално,
        когато работна смяна е преместена.
    */
    const offShift =
        shifts.find(
            shift =>
                shift.type === 'off'
        );


    /*
        Тук събираме смените,
        които трябва да бъдат
        прехвърлени.
    */
    const movedEntries = [];


    employees.forEach(
        employee => {

            let employeeHours = 0;

            const entries =
                scheduleEntries

                    .filter(
                        entry =>
                            Number(
                                entry.employee_id
                            ) ===
                            Number(
                                employee.id
                            )
                    )

                    .slice()

                    .sort(
                        (a, b) =>
                            normalizeDate(
                                a.work_date
                            )
                            .localeCompare(
                                normalizeDate(
                                    b.work_date
                                )
                            )
                    );


            entries.forEach(
                entry => {

                    const shift =
                        findShift(
                            entry.shift_id
                        );


                    if (
                        !shift ||
                        shift.type !== 'work'
                    ) {
                        return;
                    }


                    const shiftHours =
                        calculateShiftHours(
                            shift.time_from,
                            shift.time_to
                        );


                    /*
                        Ако цялата смяна не може
                        да се побере до 160 часа,
                        прехвърляме цялата смяна.
                    */
                    if (
                        employeeHours +
                        shiftHours >
                        160
                    ) {

                        const date =
                            normalizeDate(
                                entry.work_date
                            );


                        movedEntries.push({
                            employeeId:
                                Number(
                                    employee.id
                                ),

                            date:
                                date,

                            shift:
                                shift,

                            hours:
                                shiftHours
                        });


                        /*
                            В print копието
                            реалният служител
                            получава П.
                        */
                        const cell =
                            table.querySelector(
                                '.shift-cell' +
                                '[data-employee="' +
                                employee.id +
                                '"]' +
                                '[data-date="' +
                                date +
                                '"]'
                            );


                        if (cell) {

                            cell.textContent =
                                offShift
                                    ? offShift.code
                                    : 'П';


                            cell.title =
                                offShift
                                    ? offShift.name
                                    : 'Почивка';


                            cell.className =
                                'shift-cell';


                            const d =
                                new Date(
                                    date +
                                    'T12:00:00'
                                );


                            if (
                                d.getDay() === 0 ||
                                d.getDay() === 6
                            ) {

                                cell.classList.add(
                                    'weekend'
                                );
                            }


                            if (offShift) {

                                const cls =
                                    shiftClass(
                                        offShift.type
                                    );

                                if (cls) {

                                    cell.classList.add(
                                        cls
                                    );
                                }
                            }
                        }


                        return;
                    }


                    employeeHours +=
                        shiftHours;
                }
            );


            /*
                Поправяме статистиката
                на реалния служител
                в print копието.
            */
            const movedForEmployee =
                movedEntries.filter(
                    item =>
                        item.employeeId ===
                        Number(
                            employee.id
                        )
                );


            if (
                movedForEmployee.length >
                0
            ) {

                const rowCell =
                    table.querySelector(
                        '.shift-cell' +
                        '[data-employee="' +
                        employee.id +
                        '"]'
                    );


                if (rowCell) {

                    const row =
                        rowCell.closest(
                            'tr'
                        );


                    if (row) {

                        const statCells =
                            row.querySelectorAll(
                                '.stat-cell'
                            );


                        const originalStats =
                            calculateStats(
                                employee.id,
                                Number(
                                    rowCell.dataset.date
                                        .substring(
                                            0,
                                            4
                                        )
                                ),
                                Number(
                                    rowCell.dataset.date
                                        .substring(
                                            5,
                                            7
                                        )
                                )
                            );


                        let movedHours = 0;
                        let movedWorkDays = 0;


                        movedForEmployee.forEach(
                            item => {

                                movedHours +=
                                    item.hours;


                                if (
                                    Number(
                                        item.shift
                                            .counts_as_work_day
                                    ) === 1
                                ) {

                                    movedWorkDays++;
                                }
                            }
                        );


                        if (
                            statCells.length >= 5
                        ) {

                            statCells[0]
                                .textContent =
                                Math.max(
                                    0,
                                    originalStats.workDays -
                                    movedWorkDays
                                );


                            statCells[1]
                                .textContent =
                                formatHours(
                                    Math.max(
                                        0,
                                        originalStats.hours -
                                        movedHours
                                    )
                                );
                        }
                    }
                }
            }
        }
    );


    /*
        Разпределяме преместените смени
        между необходимия брой
        допълнителни служители.

        Причината да могат да се появят
        повече от един е:
        - не повече от 160 часа;
        - един човек не може да има
          две различни смени на една дата.
    */

    const plannedWorkers = [];


    movedEntries.forEach(
        item => {

            let worker =
                plannedWorkers.find(
                    candidate =>

                        candidate.hours +
                        item.hours <=
                        160 &&

                        !candidate.dates.has(
                            item.date
                        )
                );


            if (!worker) {

                worker = {
                    hours: 0,
                    workDays: 0,
                    dates:
                        new Set(),
                    entries: []
                };


                plannedWorkers.push(
                    worker
                );
            }


            worker.hours +=
                item.hours;


            if (
                Number(
                    item.shift
                        .counts_as_work_day
                ) === 1
            ) {

                worker.workDays++;
            }


            worker.dates.add(
                item.date
            );


            worker.entries.push(
                item
            );
        }
    );


    const dayHeaders =
        table.querySelectorAll(
            'thead .day-head'
        );


    const dayCount =
        dayHeaders.length;


    plannedWorkers.forEach(
        (worker, workerIndex) => {

            const row =
                document.createElement(
                    'tr'
                );


            /*
                №
            */
            const numberCell =
                document.createElement(
                    'td'
                );


            numberCell.className =
                'employee-number';


            numberCell.textContent =
                employees.length +
                workerIndex +
                1;


            row.appendChild(
                numberCell
            );


            /*
                Име
            */
            const nameCell =
                document.createElement(
                    'td'
                );


            nameCell.className =
                'employee-name';


            const displayName =
                workerIndex === 0
                    ? name
                    : name +
                      ' ' +
                      (workerIndex + 1);


            nameCell.innerHTML =
                '<div class="employee-row-content">' +
                    '<div class="employee-info">' +
                        '<div class="employee-main-name">' +
                            escapeHtml(
                                displayName
                            ) +
                        '</div>' +
                        '<div class="employee-position">' +
                            'Планов допълнителен служител' +
                        '</div>' +
                    '</div>' +
                '</div>';


            row.appendChild(
                nameCell
            );


            /*
                Дните
            */
            for (
                let day = 1;
                day <= dayCount;
                day++
            ) {

                const cell =
                    document.createElement(
                        'td'
                    );


                cell.className =
                    'shift-cell';


                const item =
                    worker.entries.find(
                        entry =>
                            Number(
                                entry.date.substring(
                                    8,
                                    10
                                )
                            ) === day
                    );


                if (item) {

                    cell.textContent =
                        item.shift.code;


                    cell.title =
                        item.shift.name;


                    const cls =
                        shiftClass(
                            item.shift.type
                        );


                    if (cls) {

                        cell.classList.add(
                            cls
                        );
                    }


                    const date =
                        new Date(
                            item.date +
                            'T12:00:00'
                        );


                    if (
                        date.getDay() === 0 ||
                        date.getDay() === 6
                    ) {

                        cell.classList.add(
                            'weekend'
                        );
                    }

                } else {

                    cell.textContent =
                        offShift
                            ? offShift.code
                            : 'П';


                    if (offShift) {

                        const cls =
                            shiftClass(
                                offShift.type
                            );


                        if (cls) {

                            cell.classList.add(
                                cls
                            );
                        }
                    }


                    /*
                        Вземаме weekend класа
                        директно от header-а.
                    */
                    if (
                        dayHeaders[
                            day - 1
                        ] &&
                        dayHeaders[
                            day - 1
                        ].classList.contains(
                            'weekend'
                        )
                    ) {

                        cell.classList.add(
                            'weekend'
                        );
                    }
                }


                row.appendChild(
                    cell
                );
            }


            /*
                Статистика
            */

            const values = [
                worker.workDays,
                formatHours(
                    worker.hours
                ),
                0,
                0,
                0
            ];


            values.forEach(
                value => {

                    const cell =
                        document.createElement(
                            'td'
                        );


                    cell.className =
                        'stat-cell';


                    cell.textContent =
                        value;


                    row.appendChild(
                        cell
                    );
                }
            );


            tbody.appendChild(
                row
            );
        }
    );


    /*
        Отваряме отделен прозорец.
        Текущият график НЕ се променя.
    */

    const printWindow =
        window.open(
            '',
            '_blank'
        );


    if (!printWindow) {

        showError(
            'Браузърът блокира прозореца за печат.'
        );

        return;
    }


    const currentStyles =
        Array.from(
            document.querySelectorAll(
                'style, link[rel="stylesheet"]'
            )
        )
        .map(
            element =>
                element.outerHTML
        )
        .join(
            '\n'
        );


    printWindow.document.open();


    printWindow.document.write(
        '<!DOCTYPE html>' +

        '<html lang="bg">' +

        '<head>' +

        '<meta charset="UTF-8">' +

        '<title>Планов график 160 ч.</title>' +

        currentStyles +

        '<style>' +

        'body{' +
            'background:white;' +
            'padding:20px;' +
        '}' +

        '.plan-title{' +
            'text-align:center;' +
            'font-size:22px;' +
            'font-weight:700;' +
            'margin-bottom:4px;' +
        '}' +

        '.plan-subtitle{' +
            'text-align:center;' +
            'font-size:12px;' +
            'font-weight:600;' +
            'margin-bottom:14px;' +
        '}' +

        '.employee-actions{' +
            'display:none !important;' +
        '}' +

        '@media print{' +

            'body{' +
                'padding:0;' +
            '}' +

            '.plan-title,' +
            '.plan-subtitle{' +
                'display:block !important;' +
            '}' +

        '}' +

        '</style>' +

        '</head>' +

        '<body>' +

        '<div class="plan-title">' +
            'ПЛАНОВ ГРАФИК' +
        '</div>' +

        '<div class="plan-subtitle">' +
            'Планиране при максимум 160 работни часа на служител' +
        '</div>' +

        table.outerHTML +

        '</body>' +

        '</html>'
    );


    printWindow.document.close();


    printWindow.focus();


    setTimeout(
        () => {

            printWindow.print();

        },
        300
    );
}




/* =====================================================
   PLAN SCHEDULE 160 HOURS -> EXCEL
   NOTHING IS SAVED IN DATABASE
===================================================== */




function exportScheduleExcel() {

    if (typeof XLSX === 'undefined') {
        showError('Excel библиотеката не е заредена.');
        return;
    }

    const month =
        Number(
            document.getElementById(
                'monthSelect'
            ).value
        );

    const year =
        Number(
            document.getElementById(
                'yearSelect'
            ).value
        );

    const daysInMonth =
        new Date(
            year,
            month,
            0
        ).getDate();

    const monthNamesExcel = [
        '',
        'Януари',
        'Февруари',
        'Март',
        'Април',
        'Май',
        'Юни',
        'Юли',
        'Август',
        'Септември',
        'Октомври',
        'Ноември',
        'Декември'
    ];

    const weekdayNamesExcel = [
        'Нд',
        'Пн',
        'Вт',
        'Ср',
        'Чт',
        'Пт',
        'Сб'
    ];

    const rows = [];

    rows.push([
        'ГРАФИК'
    ]);

    rows.push([
        currentObject
            ? currentObject.name
            : ''
    ]);

    rows.push([
        'месец ' +
        monthNamesExcel[month] +
        ' ' +
        year +
        ' г.'
    ]);

    rows.push([]);

    const weekdayRow = [
        '',
        ''
    ];

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );

        weekdayRow.push(
            weekdayNamesExcel[
                date.getDay()
            ]
        );
    }

    rows.push(
        weekdayRow
    );

    const header = [
        '№',
        'Служител'
    ];

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {
        header.push(day);
    }

    rows.push(
        header
    );

    employees.forEach(
        (employee, index) => {

            const row = [
                index + 1,
                employee.name
            ];

            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const date =
                    formatDate(
                        year,
                        month,
                        day
                    );

                const entry =
                    findEntry(
                        employee.id,
                        date
                    );

                const shift =
                    entry
                        ? findShift(
                            entry.shift_id
                        )
                        : null;

                row.push(
                    shift
                        ? (
                            shift.type === 'off'
                                ? ''
                                : shift.code
                          )
                        : ''
                );
            }

            rows.push(row);
        }
    );

    /*
       Съставил графика
    */

    rows.push([]);

    rows.push([
        '',
        'Съставил графика: ' +
        (
            currentUser
                ? currentUser.full_name
                : ''
        )
    ]);

    const ws =
        XLSX.utils.aoa_to_sheet(
            rows
        );

    const totalColumns =
        2 +
        daysInMonth;

    /*
       Merge заглавията
    */

    ws['!merges'] = [

        {
            s: {r:0,c:0},
            e: {r:0,c:totalColumns-1}
        },

        {
            s: {r:1,c:0},
            e: {r:1,c:totalColumns-1}
        },

        {
            s: {r:2,c:0},
            e: {r:2,c:totalColumns-1}
        }
    ];

    /*
       Ширина на колоните
    */

    const cols = [
        {wch:4},
        {wch:25}
    ];

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {
        cols.push({
            wch:4
        });
    }

    ws['!cols'] =
        cols;

    /*
       Цветове
    */

    const colors = {

        header:
            'E7E5DF',

        calendarOff:
            'C9E3C9',

        calendarHoliday:
            '9FC89F',

        border:
            '777777'
    };

    const border = {

        top: {
            style:'thin',
            color:{
                rgb:colors.border
            }
        },

        bottom: {
            style:'thin',
            color:{
                rgb:colors.border
            }
        },

        left: {
            style:'thin',
            color:{
                rgb:colors.border
            }
        },

        right: {
            style:'thin',
            color:{
                rgb:colors.border
            }
        }
    };

    /*
       Заглавие
    */

    ['A1','A2','A3'].forEach(
        (address,index) => {

            if (!ws[address]) {
                return;
            }

            ws[address].s = {

                font:{
                    bold:true,
                    sz:
                        index === 0
                            ? 18
                            : 12
                },

                alignment:{
                    horizontal:'center',
                    vertical:'center'
                }
            };
        }
    );

    /*
       Таблица
    */

    const tableStart =
        4;

    const firstEmployeeRow =
        6;

    const lastEmployeeRow =
        firstEmployeeRow +
        employees.length -
        1;

    for (
        let r = tableStart;
        r <= lastEmployeeRow;
        r++
    ) {

        for (
            let c = 0;
            c < totalColumns;
            c++
        ) {

            const address =
                XLSX.utils.encode_cell({
                    r,
                    c
                });

            if (!ws[address]) {

                ws[address] = {
                    t:'s',
                    v:''
                };
            }

            ws[address].s = {

                border,

                alignment:{
                    horizontal:
                        c === 1
                            ? 'left'
                            : 'center',

                    vertical:'center',
                    wrapText:true
                },

                font:{
                    sz:10
                }
            };
        }
    }

    /*
       Заглавни редове
    */

    [4,5].forEach(
        r => {

            for (
                let c = 0;
                c < totalColumns;
                c++
            ) {

                const address =
                    XLSX.utils.encode_cell({
                        r,
                        c
                    });

                ws[address].s = {

                    border,

                    font:{
                        bold:true,
                        sz:9
                    },

                    fill:{
                        patternType:'solid',

                        fgColor:{
                            rgb:
                                colors.header
                        }
                    },

                    alignment:{
                        horizontal:'center',
                        vertical:'center'
                    }
                };
            }
        }
    );

    /*
       Централен календар:
       - почивен/неприсъствен ден = зелено
       - официален празник = по-тъмно зелено
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const calendarDay =
            getCalendarDay(
                year,
                month,
                day
            );

        if (!calendarDay) {
            continue;
        }

        const isHoliday =
            Number(
                calendarDay.is_holiday
            ) === 1;

        const isNonWorkday =
            Number(
                calendarDay.is_workday
            ) !== 1;

        if (
            !isHoliday &&
            !isNonWorkday
        ) {
            continue;
        }

        const fillColor =
            isHoliday
                ? colors.calendarHoliday
                : colors.calendarOff;

        const column =
            day + 1;

        for (
            let r = 4;
            r <= lastEmployeeRow;
            r++
        ) {

            const address =
                XLSX.utils.encode_cell({
                    r,
                    c:column
                });

            if (!ws[address]) {
                continue;
            }

            ws[address].s = {
                ...ws[address].s,

                fill:{
                    patternType:'solid',

                    fgColor:{
                        rgb:
                            fillColor
                    }
                }
            };
        }
    }

    /*
       Print настройки в Excel
    */

    ws['!margins'] = {
        left:0.2,
        right:0.2,
        top:0.3,
        bottom:0.3,
        header:0.1,
        footer:0.1
    };

    ws['!pageSetup'] = {
        orientation:'landscape',
        fitToWidth:1,
        fitToHeight:0,
        paperSize:9
    };

    const wb =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        'График'
    );

    const filename =
        'Grafik_' +
        String(month)
            .padStart(
                2,
                '0'
            ) +
        '_' +
        year +
        '.xlsx';

    XLSX.writeFile(
        wb,
        filename
    );
}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }


    return String(value)

        .replaceAll(
            '&',
            '&amp;'
        )

        .replaceAll(
            '<',
            '&lt;'
        )

        .replaceAll(
            '>',
            '&gt;'
        )

        .replaceAll(
            '"',
            '&quot;'
        )

        .replaceAll(
            "'",
            '&#039;'
        );
}
