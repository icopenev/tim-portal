<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const objectId =
    Number(
        params.get('object')
    );


if (!objectId) {
    window.location.href =
        'obekti.html';
}


let currentUser = null;
let currentObject = null;

let shifts = [];

let workCalendar = null;
let workCalendarDays = [];


async function loadWorkCalendar(
    year,
    month
) {

    workCalendar = null;
    workCalendarDays = [];


    try {

        const calendarResponse =
            await fetch(
                '/staff-compat-api.php/api/calendar/' +
                year +
                '/' +
                month,
                {
                    credentials:
                        'same-origin'
                }
            );


        if (!calendarResponse.ok) {
            throw new Error(
                'Няма данни за работния календар.'
            );
        }


        workCalendar =
            await calendarResponse.json();


        const daysResponse =
            await fetch(
                '/staff-compat-api.php/api/calendar/' +
                year +
                '/' +
                month +
                '/days',
                {
                    credentials:
                        'same-origin'
                }
            );


        if (!daysResponse.ok) {
            throw new Error(
                'Не могат да се заредят дните от календара.'
            );
        }


        const daysData =
            await daysResponse.json();


        workCalendarDays =
            Array.isArray(daysData)
                ? daysData
                : [];


        if (
            workCalendar &&
            workCalendar.fallback
        ) {

            showError(
                'Календарът не е обновен. ' +
                'Използват се последните локални данни.'
            );
        }


    } catch (error) {

        console.error(
            'Calendar:',
            error
        );

        showError(
            'Работният календар не може да бъде зареден.'
        );
    }
}



function getCalendarDay(
    year,
    month,
    day
) {

    const dateString =
        year +
        '-' +
        String(month).padStart(2, '0') +
        '-' +
        String(day).padStart(2, '0');


    return workCalendarDays.find(
        item =>
            item.work_date ===
            dateString
    ) || null;
}



function calendarDayClass(
    year,
    month,
    day
) {

    const calendarDay =
        getCalendarDay(
            year,
            month,
            day
        );


    if (calendarDay) {

        if (
            Number(
                calendarDay.is_holiday
            ) === 1
        ) {
            return 'calendar-holiday';
        }


        if (
            Number(
                calendarDay.is_workday
            ) !== 1
        ) {
            return 'calendar-off';
        }
    }


    return '';
}



function calendarDayTitle(
    year,
    month,
    day
) {

    const calendarDay =
        getCalendarDay(
            year,
            month,
            day
        );


    return (
        calendarDay &&
        calendarDay.holiday_name
            ? calendarDay.holiday_name
            : ''
    );
}

        );


    for (
        let month = 1;
        month <= 12;
        month++
    ) {

        const option =
            document.createElement(
                'option'
            );

        option.value =
            month;

        option.textContent =
            monthNames[month];

        monthSelect.appendChild(
            option
        );
    }


    const now =
        new Date();


    for (
        let year =
            now.getFullYear() - 5;

        year <=
            now.getFullYear() + 5;

        year++
    ) {

        const option =
            document.createElement(
                'option'
            );

        option.value =
            year;

        option.textContent =
            year;

        yearSelect.appendChild(
            option
        );
    }


    monthSelect.value =
        now.getMonth() + 1;

    yearSelect.value =
        now.getFullYear();


    monthSelect.addEventListener(
        'change',
        loadForecast
    );


    yearSelect.addEventListener(
        'change',
        loadForecast
    );
}

function renderSchedule(
    year,
    month
) {

    const wrapper =
        document.getElementById(
            'tableWrapper'
        );


    const daysInMonth =
        new Date(
            year,
            month,
            0
        ).getDate();


    const startDay = 1;
    const endDay = daysInMonth;


    let html =
        '<table>';


    html +=
        '<thead><tr>';


    html +=
        '<th>№</th>';

    html +=
        '<th class="employee-head">Служител</th>';


    for (
        let day = startDay;
        day <= endDay;
        day++
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );


        const holidayTitle =
            calendarDayTitle(
                year,
                month,
                day
            );


        html +=
            '<th class="day-head ' +
            calendarDayClass(
                year,
                month,
                day
            ) +
            '" ' +
            (
                holidayTitle
                    ? 'title="' +
                      holidayTitle +
                      '"'
                    : ''
            ) +
            '>' +

            '<span class="weekday">' +
            weekdayNames[
                date.getDay()
            ] +
            '</span>' +

            '<span class="day-number">' +
            day +
            '</span>' +

            '</th>';
    }


    html +=
        '<th class="stats-head" title="Работни дни">Раб.<br>дни</th>';

    html +=
        '<th class="stats-head" title="Часове">Час.</th>';

    html +=
        '<th class="stats-head" title="Нощни часове">Нощ.</th>';

    html +=
        '<th class="stats-head" title="Празнични часове">Празн.</th>';

    html +=
        '<th class="stats-head" title="Дежурства">Деж.</th>';

    html +=
        '<th class="stats-head" title="Отпуск">Отп.</th>';

    html +=
        '<th class="stats-head" title="Болнични">Болн.</th>';


    html +=
        '</tr></thead>';


    html +=
        '<tbody>';


    workers.forEach(
        (worker, index) => {

            const stats =
                calculateStats(
                    worker.id,
                    year,
                    month
                );


            html +=
                '<tr class="' +
                (
                    Number(
                        worker.is_extra
                    ) === 1
                        ? 'extra-worker'
                        : ''
                ) +
                '">';


            html +=
                '<td class="employee-number">' +
                (index + 1) +
                '</td>';


            html +=
                '<td class="employee-name">' +

                '<div class="employee-main-name">' +
                escapeHtml(
                    worker.name
                ) +

                '</div>';


            if (
                worker.position_name
            ) {

                html +=
                    '<div class="employee-position">' +
                    escapeHtml(
                        worker.position_name
                    ) +
                    '</div>';
            }


            if (
                Number(
                    worker.is_extra
                ) === 1
            ) {

                html +=
                    '<span class="extra-label">Доп.</span>';


                const safeWorkerName =
                    String(
                        worker.name || ''
                    )
                    .replace(/\\/g, '\\\\')
                    .replace(/'/g, "\\'");


                html +=
                    '<button class="edit-worker" ' +
                    'onclick="event.stopPropagation();openForecastEmployeeModal(' +
                    Number(worker.id) +
                    ',\'' +
                    safeWorkerName +
                    '\')">✎</button>';


                html +=
                    '<button class="delete-worker" ' +
                    'onclick="event.stopPropagation();deleteWorker(' +
                    Number(worker.id) +
                    ')">×</button>';
            }


            html +=
                '</td>';


            for (
        let day = startDay;
        day <= endDay;
        day++
    ) {

                const dateString =
                    formatDate(
                        year,
                        month,
                        day
                    );


                const entry =
                    findEntry(
                        worker.id,
                        dateString
                    );


                const shift =
                    entry
                        ? findShift(
                            entry.shift_id
                        )
                        : null;


                const date =
                    new Date(
                        year,
                        month - 1,
                        day
                    );


                const weekend =
                    false;


                const locked =
                    day <= 15 &&
                    Number(
                        worker.is_extra
                    ) === 0;


                const cssClass =
                    shift
                        ? shiftClass(
                            shift.type
                        )
                        : '';


                html +=
                    '<td ' +

                    'class="shift-cell ' +

                    (
                        calendarDayClass(
                            year,
                            month,
                            day
                        ) + ' '
                    ) +

                    cssClass +
                    ' ' +

                    'editable' +

                    '" ' +

                    'data-worker="' +
                    worker.id +
                    '" ' +

                    'data-date="' +
                    dateString +
                    '" ' +

                    'onclick="cellClick(event,this)" ' +

                    'title="' +
                    (
                        shift
                            ? escapeHtml(
                                shift.name
                            )
                            : ''
                    ) +
                    '">' +

                    (
                        shift
                            ? (
                                shift.type === 'off'
                                    ? ''
                                    : escapeHtml(
                                        shift.code
                                    )
                              )
                            : ''
                    ) +

                    '</td>';
            }


            html +=
                '<td class="stat-cell" style="font-weight:700 !important;">' +
                stats.workDays +
                '</td>';


            html +=
                '<td class="stat-cell ' +
                (
                    stats.hours > 160
                        ? 'over-limit'
                        : ''
                ) +
                '" style="font-weight:700 !important;">' +
                formatHours(
                    stats.hours
                ) +
                '</td>';


            html +=
                '<td class="stat-cell" style="font-weight:700 !important;">' +
                formatHours(
                    stats.nightHours || 0
                ) +
                '</td>';


            html +=
                '<td class="stat-cell" style="font-weight:700 !important;">' +
                formatHours(
                    stats.holidayHours || 0
                ) +
                '</td>';


            html +=
                '<td class="stat-cell" style="font-weight:700 !important;">' +
                stats.duties +
                '</td>';


            html +=
                '<td class="stat-cell" style="font-weight:700 !important;">' +
                stats.vacation +
                '</td>';


            html +=
                '<td class="stat-cell" style="font-weight:700 !important;">' +
                stats.sick +
                '</td>';


            html +=
                '</tr>';
        }
    );


    html +=
        '</tbody></table>';


    wrapper.innerHTML =
        html;
}

async function saveCell(
    shiftId
) {

    closeCellMenu();


    const shift =
        findShift(
            shiftId
        );


    /*
       Предварителна проверка 160 часа.
    */

    if (
        shift &&
        (
            shift.type === 'work' ||
            shift.type === 'duty'
        )
    ) {

        const currentStats =
            calculateStats(
                selectedWorkerId,
                Number(
                    selectedDate.substring(
                        0,
                        4
                    )
                ),
                Number(
                    selectedDate.substring(
                        5,
                        7
                    )
                )
            );


        const oldEntry =
            findEntry(
                selectedWorkerId,
                selectedDate
            );


        let projectedHours =
            currentStats.hours;


        if (oldEntry) {

            const oldShift =
                findShift(
                    oldEntry.shift_id
                );


            if (
                oldShift &&
                (
                    oldShift.type === 'work' ||
                    oldShift.type === 'duty'
                )
            ) {

                projectedHours -=
                    calculateShiftHours(
                        oldShift.time_from,
                        oldShift.time_to
                    );
            }
        }


        projectedHours +=
            calculateShiftHours(
                shift.time_from,
                shift.time_to
            );


        if (
            projectedHours > 160
        ) {

            alert(
                'Служителят ще надвиши 160 часа.\n\n' +
                'Прогнозни часове: ' +
                formatHours(
                    projectedHours
                ) +
                '\n\nНеобходимо е да се добави друг служител.'
            );

            return;
        }
    }


    const response =
        await fetch(
            '/staff-compat-api.php/api/forecasts/' +
            objectId +
            '/entry',
            {
                method:
                    'PUT',

                credentials:
                    'same-origin',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({

                        forecast_id:
                            forecast.id,

                        forecast_worker_id:
                            selectedWorkerId,

                        work_date:
                            selectedDate,

                        shift_id:
                            shiftId,

                        note:
                            ''
                    })
            }
        );


    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


    if (!response.ok) {

        showError(
            data.error ||
            'Грешка при запис'
        );

        return;
    }


    await loadForecast(
        true
    );
}



function calculateStats(
    workerId,
    year,
    month
) {

    let workDays = 0;
    let hours = 0;
    let nightHours = 0;
    let holidayHours = 0;
    let duties = 0;
    let vacation = 0;
    let sick = 0;


    entries.forEach(
        entry => {

            if (
                Number(
                    entry.forecast_worker_id
                ) !==
                Number(
                    workerId
                )
            ) {
                return;
            }


            const date =
                normalizeDate(
                    entry.work_date
                );


            if (
                Number(
                    date.substring(
                        0,
                        4
                    )
                ) !== year ||

                Number(
                    date.substring(
                        5,
                        7
                    )
                ) !== month
            ) {

                return;
            }


            const shift =
                findShift(
                    entry.shift_id
                );


            if (!shift) {
                return;
            }


            if (
                Number(
                    shift.counts_as_work_day
                ) === 1
            ) {

                workDays++;
            }


            if (
                shift.type === 'work' ||
                shift.type === 'duty'
            ) {

                hours +=
                    calculateShiftHours(
                        shift.time_from,
                        shift.time_to
                    );

                nightHours +=
                    calculateNightHours(
                        shift.time_from,
                        shift.time_to
                    );

                holidayHours +=
                    calculateHolidayHours(
                        date,
                        shift.time_from,
                        shift.time_to
                    );
            }


            if (
                shift.type === 'duty'
            ) {
                duties++;
            }


            if (
                shift.type === 'vacation'
            ) {
                vacation++;
            }


            if (
                shift.type === 'sick'
            ) {
                sick++;
            }
        }
    );


    return {
        workDays,
        hours,
        nightHours,
        holidayHours,
        duties,
        vacation,
        sick
    };
}





function calculateNightHours(
    timeFrom,
    timeTo
) {

    if (
        !timeFrom ||
        !timeTo
    ) {
        return 0;
    }


    const start =
        timeToMinutes(
            timeFrom
        );


    let end =
        timeToMinutes(
            timeTo
        );


    if (
        end <= start
    ) {
        end +=
            24 * 60;
    }


    let total = 0;


    /*
       Нощен труд:
       22:00 - 06:00

       Проверяваме два нощни прозореца,
       за да покрием смяна през полунощ.
    */

    const windows = [
        [22 * 60, 30 * 60],
        [-2 * 60, 6 * 60]
    ];


    for (
        const [nightStart, nightEnd]
        of windows
    ) {

        const overlapStart =
            Math.max(
                start,
                nightStart
            );


        const overlapEnd =
            Math.min(
                end,
                nightEnd
            );


        if (
            overlapEnd >
            overlapStart
        ) {

            total +=
                overlapEnd -
                overlapStart;
        }
    }


    return total / 60;
}


function calculateHolidayHours(
    workDate,
    timeFrom,
    timeTo
) {

    if (
        !workDate ||
        !timeFrom ||
        !timeTo
    ) {
        return 0;
    }


    const start =
        timeToMinutes(
            timeFrom
        );


    let end =
        timeToMinutes(
            timeTo
        );


    const overnight =
        end <= start;


    let total = 0;


    // =========================================
    // Първи календарен ден
    // =========================================

    const firstEnd =
        overnight
            ? 24 * 60
            : end;


    const firstMinutes =
        Math.max(
            0,
            firstEnd - start
        );


    const firstCalendarDay =
        workCalendarDays.find(
            item =>
                item.work_date ===
                workDate
        );


    if (
        firstCalendarDay &&
        Number(
            firstCalendarDay.is_holiday
        ) === 1
    ) {

        total +=
            firstMinutes / 60;
    }


    // =========================================
    // Следващ календарен ден
    // =========================================

    if (overnight) {

        const parts =
            workDate.split('-');


        const nextDate =
            new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2]) + 1
            );


        const nextDateString =
            nextDate.getFullYear() +
            '-' +
            String(
                nextDate.getMonth() + 1
            ).padStart(2, '0') +
            '-' +
            String(
                nextDate.getDate()
            ).padStart(2, '0');


        const nextCalendarDay =
            workCalendarDays.find(
                item =>
                    item.work_date ===
                    nextDateString
            );


        if (
            nextCalendarDay &&
            Number(
                nextCalendarDay.is_holiday
            ) === 1
        ) {

            total +=
                end / 60;
        }
    }


    return total;
}


function calculateShiftHours(
    timeFrom,
    timeTo
) {

    if (
        !timeFrom ||
        !timeTo
    ) {
        return 0;
    }


    const from =
        timeToMinutes(
            timeFrom
        );


    let to =
        timeToMinutes(
            timeTo
        );


    if (
        to <= from
    ) {

        to +=
            24 * 60;
    }


    return (
        to - from
    ) / 60;
}



function timeToMinutes(
    value
) {

    const parts =
        String(value)
            .split(':');


    return (
        Number(parts[0]) *
        60
    ) +
    Number(parts[1]);
}



function findEntry(
    workerId,
    date
) {

    return entries.find(
        entry =>
            Number(
                entry.forecast_worker_id
            ) ===
            Number(
                workerId
            ) &&

            normalizeDate(
                entry.work_date
            ) ===
            date
    );
}



function findShift(
    shiftId
) {

    return shifts.find(
        shift =>
            Number(
                shift.id
            ) ===
            Number(
                shiftId
            )
    );
}



function shiftClass(
    type
) {

    switch (type) {

        case 'work':
            return 'shift-work';

        case 'duty':
            return 'shift-duty';

        case 'off':
            return 'shift-off';

        case 'vacation':
            return 'shift-vacation';

        case 'sick':
            return 'shift-sick';

        default:
            return '';
    }
}



function renderLegend() {

    const container =
        document.getElementById(
            'legend'
        );


    let html = '';


    shifts.forEach(
        shift => {

            html +=
                '<div class="legend-row">' +

                '<span class="legend-code">' +
                escapeHtml(
                    shift.code
                ) +
                '</span>' +

                escapeHtml(
                    shift.name
                ) +

                (
                    shift.time_from &&
                    shift.time_to

                        ? ' от ' +
                          String(
                              shift.time_from
                          ).substring(
                              0,
                              5
                          ) +
                          'ч. до ' +
                          String(
                              shift.time_to
                          ).substring(
                              0,
                              5
                          ) +
                          'ч.'

                        : ''
                ) +

                '</div>';
        }
    );


    container.innerHTML =
        html;
}



function previousMonth() {

    let month =
        Number(
            document
                .getElementById(
                    'monthSelect'
                )
                .value
        );


    let year =
        Number(
            document
                .getElementById(
                    'yearSelect'
                )
                .value
        );


    month--;


    if (
        month < 1
    ) {

        month = 12;
        year--;
    }


    setMonthYear(
        month,
        year
    );
}



function nextMonth() {

    let month =
        Number(
            document
                .getElementById(
                    'monthSelect'
                )
                .value
        );


    let year =
        Number(
            document
                .getElementById(
                    'yearSelect'
                )
                .value
        );


    month++;


    if (
        month > 12
    ) {

        month = 1;
        year++;
    }


    setMonthYear(
        month,
        year
    );
}



function setMonthYear(
    month,
    year
) {

    const yearSelect =
        document.getElementById(
            'yearSelect'
        );


    if (
        !Array
            .from(
                yearSelect.options
            )
            .some(
                option =>
                    Number(
                        option.value
                    ) ===
                    year
            )
    ) {

        const option =
            document.createElement(
                'option'
            );

        option.value =
            year;

        option.textContent =
            year;

        yearSelect.appendChild(
            option
        );
    }


    document
        .getElementById(
            'monthSelect'
        )
        .value =
            month;


    yearSelect.value =
        year;


    loadForecast();
}



function formatDate(
    year,
    month,
    day
) {

    return (
        year +
        '-' +
        String(month)
            .padStart(
                2,
                '0'
            ) +
        '-' +
        String(day)
            .padStart(
                2,
                '0'
            )
    );
}



function normalizeDate(
    value
) {

    if (!value) {
        return '';
    }

    return String(value)
        .substring(
            0,
            10
        );
}



function formatHours(
    value
) {

    return Number.isInteger(
        value
    )
        ? value
        : Number(value)
            .toFixed(1);
}



async function apiFetch(
    url
) {

    try {

        const response =
            await fetch(
                url,
                {
                    credentials:
                        'same-origin'
                }
            );


        if (
            response.status === 401
        ) {

            window.location.href =
                '/login.php';

            return null;
        }


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                'API грешка'
            );
        }


        return data;


    } catch (error) {

        showError(
            error.message
        );

        return null;
    }
}



function showError(
    message
) {

    const box =
        document.getElementById(
            'error'
        );


    box.textContent =
        message;


    box.style.display =
        'block';


    setTimeout(
        () => {

            box.style.display =
                'none';

        },
        7000
    );
}



function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {
        return '';
    }


    return String(value)

        .replaceAll(
            '&',
            '&amp;'
        )

        .replaceAll(
            '<',
            '&lt;'
        )

        .replaceAll(
            '>',
            '&gt;'
        )

        .replaceAll(
            '"',
            '&quot;'
        )

        .replaceAll(
            "'",
            '&#039;'
        );
}




/* =====================================================
   EXPORT FORECAST TO EXCEL
===================================================== */

function exportForecastExcel() {

    if (
        typeof XLSX ===
        'undefined'
    ) {

        showError(
            'Excel библиотеката не е заредена.'
        );

        return;
    }


    if (
        !forecast ||
        workers.length === 0
    ) {

        showError(
            'Няма зареден прогнозен график.'
        );

        return;
    }


    const year =
        Number(
            forecast.year
        );


    const month =
        Number(
            forecast.month
        );


    const daysInMonth =
        new Date(
            year,
            month,
            0
        ).getDate();


    const rows = [];


    rows.push([
        'ПРОГНОЗЕН ГРАФИК'
    ]);


    rows.push([
        currentObject
            ? currentObject.name
            : ''
    ]);


    rows.push([
        'месец ' +
        monthNames[month] +
        ' ' +
        year +
        ' г.'
    ]);


    rows.push([]);


    const weekdayRow = [
        '',
        ''
    ];


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );


        weekdayRow.push(
            weekdayNames[
                date.getDay()
            ]
        );
    }


    rows.push(
        weekdayRow
    );


    const header = [
        '№',
        'Служител'
    ];


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        header.push(
            day
        );
    }


    rows.push(
        header
    );


    workers.forEach(
        (worker, index) => {

            const row = [
                index + 1,
                worker.name
            ];


            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const date =
                    formatDate(
                        year,
                        month,
                        day
                    );


                const entry =
                    findEntry(
                        worker.id,
                        date
                    );


                const shift =
                    entry
                        ? findShift(
                            entry.shift_id
                        )
                        : null;


                row.push(
                    shift
                        ? shift.code
                        : ''
                );
            }


            rows.push(
                row
            );
        }
    );


    const ws =
        XLSX.utils.aoa_to_sheet(
            rows
        );


    const totalColumns =
        2 +
        daysInMonth;


    ws['!merges'] = [

        {
            s: {
                r: 0,
                c: 0
            },

            e: {
                r: 0,
                c: totalColumns - 1
            }
        },

        {
            s: {
                r: 1,
                c: 0
            },

            e: {
                r: 1,
                c: totalColumns - 1
            }
        },

        {
            s: {
                r: 2,
                c: 0
            },

            e: {
                r: 2,
                c: totalColumns - 1
            }
        }
    ];


    const cols = [

        {
            wch: 4
        },

        {
            wch: 24
        }
    ];


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        cols.push({
            wch: 4
        });
    }


    ws['!cols'] =
        cols;


    ws['!rows'] =
        rows.map(
            (_, index) => {

                if (
                    index === 0
                ) {
                    return {
                        hpt: 26
                    };
                }


                if (
                    index === 1 ||
                    index === 2
                ) {
                    return {
                        hpt: 20
                    };
                }


                if (
                    index === 3
                ) {
                    return {
                        hpt: 8
                    };
                }


                return {
                    hpt: 24
                };
            }
        );


    const colors = {

        header:
            'E7E5DF',

        weekend:
            'EEEEEE',

        work:
            'DCEFE2',

        duty:
            'FFF0C9',

        off:
            'F3F3F3',

        vacation:
            'DDEBFF',

        sick:
            'FFDCDC',

        extra:
            'FFF4CC',

        border:
            '777777'
    };


    const border = {

        top: {
            style: 'thin',
            color: {
                rgb: colors.border
            }
        },

        bottom: {
            style: 'thin',
            color: {
                rgb: colors.border
            }
        },

        left: {
            style: 'thin',
            color: {
                rgb: colors.border
            }
        },

        right: {
            style: 'thin',
            color: {
                rgb: colors.border
            }
        }
    };


    ['A1', 'A2', 'A3'].forEach(
        (address, index) => {

            if (!ws[address]) {
                return;
            }


            ws[address].s = {

                font: {
                    bold: true,
                    sz:
                        index === 0
                            ? 17
                            : 12
                },

                alignment: {
                    horizontal:
                        'center',
                    vertical:
                        'center'
                }
            };
        }
    );


    /*
       Таблицата започва от Excel row 5 / zero-based 4
    */

    for (
        let r = 4;
        r < rows.length;
        r++
    ) {

        for (
            let c = 0;
            c < totalColumns;
            c++
        ) {

            const address =
                XLSX.utils.encode_cell({
                    r,
                    c
                });


            if (!ws[address]) {

                ws[address] = {
                    t: 's',
                    v: ''
                };
            }


            ws[address].s = {

                border,

                alignment: {
                    horizontal:
                        c === 1
                            ? 'left'
                            : 'center',

                    vertical:
                        'center',

                    wrapText:
                        true
                },

                font: {
                    sz: 10
                }
            };
        }
    }


    /*
       Weekday + day header
    */

    for (
        let c = 0;
        c < totalColumns;
        c++
    ) {

        [4, 5].forEach(
            r => {

                const address =
                    XLSX.utils.encode_cell({
                        r,
                        c
                    });


                ws[address].s = {

                    border,

                    font: {
                        bold: true,
                        sz: 9
                    },

                    fill: {
                        patternType:
                            'solid',

                        fgColor: {
                            rgb:
                                colors.header
                        }
                    },

                    alignment: {
                        horizontal:
                            'center',
                        vertical:
                            'center',
                        wrapText:
                            true
                    }
                };
            }
        );
    }


    /*
       Weekend columns
    */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );


        const weekend =
            date.getDay() === 0 ||
            date.getDay() === 6;


        if (!weekend) {
            continue;
        }


        const column =
            day + 1;


        for (
            let r = 4;
            r < rows.length;
            r++
        ) {

            const address =
                XLSX.utils.encode_cell({
                    r,
                    c: column
                });


            ws[address].s = {
                ...ws[address].s,

                fill: {
                    patternType:
                        'solid',

                    fgColor: {
                        rgb:
                            colors.weekend
                    }
                }
            };
        }
    }


    /*
       Shift colors
    */

    const firstWorkerRow =
        6;


    workers.forEach(
        (worker, workerIndex) => {

            const excelRow =
                firstWorkerRow +
                workerIndex;


            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const date =
                    formatDate(
                        year,
                        month,
                        day
                    );


                const entry =
                    findEntry(
                        worker.id,
                        date
                    );


                if (!entry) {
                    continue;
                }


                const shift =
                    findShift(
                        entry.shift_id
                    );


                if (!shift) {
                    continue;
                }


                let color = null;


                switch (
                    shift.type
                ) {

                    case 'work':
                        color =
                            colors.work;
                        break;

                    case 'duty':
                        color =
                            colors.duty;
                        break;

                    case 'off':
                        color =
                            colors.off;
                        break;

                    case 'vacation':
                        color =
                            colors.vacation;
                        break;

                    case 'sick':
                        color =
                            colors.sick;
                        break;
                }


                const address =
                    XLSX.utils.encode_cell({
                        r: excelRow,
                        c: day + 1
                    });


                if (
                    color &&
                    ws[address]
                ) {

                    ws[address].s = {
                        ...ws[address].s,

                        fill: {
                            patternType:
                                'solid',

                            fgColor: {
                                rgb:
                                    color
                            }
                        },

                        font: {
                            bold: true,
                            sz: 10
                        }
                    };
                }
            }


            /*
               Допълнително добавен служител
            */

            if (
                Number(
                    worker.is_extra
                ) === 1
            ) {

                for (
                    let c = 0;
                    c < 2;
                    c++
                ) {

                    const address =
                        XLSX.utils.encode_cell({
                            r: excelRow,
                            c
                        });


                    ws[address].s = {
                        ...ws[address].s,

                        fill: {
                            patternType:
                                'solid',

                            fgColor: {
                                rgb:
                                    colors.extra
                            }
                        },

                        font: {
                            bold: true
                        }
                    };
                }
            }
        }
    );


    ws['!margins'] = {
        left: 0.2,
        right: 0.2,
        top: 0.3,
        bottom: 0.3,
        header: 0.1,
        footer: 0.1
    };


    ws['!pageSetup'] = {
        orientation:
            'landscape',

        fitToWidth:
            1,

        fitToHeight:
            0,

        paperSize:
            9
    };


    const wb =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        wb,
        ws,
        'Прогнозен график'
    );


    const filename =
        'Prognozen_Grafik_' +
        String(month)
            .padStart(
                2,
                '0'
            ) +
        '_' +
        year +
        '.xlsx';


    XLSX.writeFile(
        wb,
        filename
    );
}

    window.location.href =

}
